services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: procure
      POSTGRES_PASSWORD: procure
      POSTGRES_DB: procure
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procure -d procure"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build: ./mcp_server
    ports:
      - "8001:8001"
    environment:
      MCP_TRANSPORT: streamable-http
    command: ["python", "-m", "mcp_server.erp_mcp"]

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://procure:procure@postgres:5432/procure
      ERP_MCP_URL: http://mcp-server:8001/mcp
      ERP_MCP_TRANSPORT: http
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_started
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: